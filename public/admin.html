<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无界创镜 AI · 管理后台</title>
<style>
:root{
  --bg:#0a0712; --panel:#140f24; --panel2:#1b1430; --line:rgba(255,255,255,.08);
  --text:#eee9f8; --dim:#8d84ab; --accent:#8b5cf6; --accent2:#ec4899;
  --gold:#f5c451; --ok:#34d399; --err:#fb7185;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC",system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:13px}
button,input,select,textarea{font-family:inherit;font-size:13px}

/* 登录 */
#login{display:flex;align-items:center;justify-content:center;height:100vh}
#login .box{width:360px;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:30px}
#login h1{margin:0 0 6px;font-size:19px}
#login p{margin:0 0 20px;color:var(--dim);font-size:12px}
#login input{width:100%;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);color:var(--text);outline:none;margin-bottom:12px}
#login button{width:100%;padding:12px;border-radius:11px;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}

/* 布局 */
#app{display:none;height:100vh;overflow:hidden}
.layout{display:flex;height:100vh}
.side{width:200px;flex:0 0 200px;background:linear-gradient(180deg,#151027,#0c0918);
  border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px}
.side .logo{font-size:16px;font-weight:800;padding:6px 12px 18px;color:#fff}
.side .label{font-size:10px;color:#5a5178;padding:8px 12px 5px;letter-spacing:.5px}
.nav{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;
  cursor:pointer;color:#b8afd0;font-size:13px}
.nav:hover{background:rgba(255,255,255,.05);color:#fff}
.nav.active{background:rgba(139,92,246,.18);color:#fff}
.nav .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.side .foot{margin-top:auto;font-size:10px;color:#3f3858;padding:10px 12px}

.main{flex:1;overflow-y:auto;padding:22px 26px}
h2.title{font-size:19px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:20px}

/* 卡片/统计 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px}
.stat .k{font-size:11px;color:var(--dim)}
.stat .v{font-size:23px;font-weight:800;margin-top:6px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.panel h3{margin:0 0 14px;font-size:14px;display:flex;align-items:center;gap:8px}
.panel h3 .tag{font-size:10px;background:rgba(139,92,246,.2);color:#c4b1ff;
  padding:2px 8px;border-radius:6px;font-weight:400}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05)}
th{color:var(--dim);font-size:11px;font-weight:600}
tr:hover td{background:rgba(255,255,255,.025)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}

/* 表单 */
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);color:var(--text);outline:none}
.field textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.btn{padding:8px 16px;border-radius:9px;border:0;cursor:pointer;font-size:12.5px;
  font-weight:600;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#c4b1ff}
.btn.danger{background:rgba(251,113,133,.14);border:1px solid rgba(251,113,133,.3);color:var(--err)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:default}

.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:600}
.pill.ok{background:rgba(52,211,153,.15);color:var(--ok)}
.pill.warn{background:rgba(245,196,81,.15);color:var(--gold)}
.pill.err{background:rgba(251,113,133,.15);color:var(--err)}
.pill.dim{background:rgba(255,255,255,.08);color:var(--dim)}

.switch{width:38px;height:21px;border-radius:11px;background:rgba(255,255,255,.14);
  position:relative;cursor:pointer;transition:.15s;flex:0 0 auto}
.switch.on{background:var(--accent)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;
  border-radius:50%;background:#fff;transition:.15s}
.switch.on::after{left:19px}

.masked{color:var(--dim);font-family:ui-monospace,monospace}

/* 弹层 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:100;
  align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal.show{display:flex}
.modal .box{width:min(720px,100%);background:var(--panel2);border:1px solid var(--line);
  border-radius:16px;padding:22px;position:relative}
.modal .close{position:absolute;top:14px;right:16px;background:none;border:0;
  color:var(--dim);font-size:17px;cursor:pointer}

.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--line);padding:11px 20px;
  border-radius:11px;z-index:200;font-size:13px;display:none}
.toast.show{display:block}

.bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:8px}
.bars .bar{flex:1;background:linear-gradient(to top,rgba(139,92,246,.5),var(--accent));
  border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars .bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;
  font-size:9px;color:var(--dim)}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="box">
    <h1>无界创镜 AI · 管理后台</h1>
    <p>输入后台令牌进入</p>
    <input id="tok" type="password" placeholder="Admin Token" value="">
    <button onclick="doLogin()">进入后台</button>
  </div>
</div>

<!-- 主体 -->
<div id="app">
  <div class="layout">
    <aside class="side">
      <div class="logo">无界创镜 AI</div>

      <div class="label">概览</div>
      <div class="nav active" data-page="dash"><span class="dot"></span>数据看板</div>

      <div class="label">模型配置</div>
      <div class="nav" data-page="textModels"><span class="dot"></span>文字模型</div>
      <div class="nav" data-page="imageModels"><span class="dot"></span>生图模型</div>
      <div class="nav" data-page="config"><span class="dot"></span>全局参数</div>

      <div class="label">运营</div>
      <div class="nav" data-page="users"><span class="dot"></span>用户管理</div>
      <div class="nav" data-page="cards"><span class="dot"></span>角色卡</div>
      <div class="nav" data-page="orders"><span class="dot"></span>订单</div>
      <div class="nav" data-page="logs"><span class="dot"></span>操作日志</div>

      <div class="foot">v1.0 · <span id="who"></span></div>
    </aside>

    <main class="main" id="main"></main>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
let TOKEN = '';
let CURRENT = 'dash';

const $ = s => document.querySelector(s);
const fmt = n => Number(n || 0).toLocaleString('zh-CN');
const dt = t => t ? new Date(Number(t)).toLocaleString('zh-CN', { hour12: false }) : '-';
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function toast(msg, ms = 2000) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms);
}

async function api(name, body = {}) {
  const r = await fetch('/api/admin/' + name, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': TOKEN },
    body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.message || j.error || ('HTTP ' + r.status));
  return j;
}

function doLogin() {
  TOKEN = $('#tok').value.trim();
  if (!TOKEN) return alert('请输入后台令牌');
  api('overview').then(() => {
    $('#login').style.display = 'none';
    $('#app').style.display = 'block';
    $('#who').textContent = '已登录';
    render('dash');
  }).catch(e => alert('登录失败: ' + e.message));
}

document.querySelectorAll('.nav').forEach(n => {
  n.onclick = () => render(n.dataset.page);
});

function setActive(page) {
  document.querySelectorAll('.nav').forEach(n =>
    n.classList.toggle('active', n.dataset.page === page));
}

// ==================== 页面渲染 ====================
const PAGES = {};

PAGES.dash = async () => {
  const d = await api('overview');
  const s = d.stats;
  const maxU = Math.max(...d.daily.map(x => x.users), 1);
  const maxM = Math.max(...d.daily.map(x => x.messages), 1);

  return `
  <h2 class="title">数据看板</h2>
  <div class="sub">实时统计（热度由真实交互累加）</div>

  <div class="grid">
    <div class="stat"><div class="k">总用户</div><div class="v">${fmt(s.users)}</div></div>
    <div class="stat"><div class="k">今日新增</div><div class="v">${fmt(s.newUsersToday)}</div></div>
    <div class="stat"><div class="k">7日活跃</div><div class="v">${fmt(s.activeUsers7d)}</div></div>
    <div class="stat"><div class="k">角色卡</div><div class="v">${fmt(s.cards)}</div></div>
    <div class="stat"><div class="k">消息数</div><div class="v">${fmt(s.messages)}</div></div>
    <div class="stat"><div class="k">付费订单</div><div class="v">${fmt(s.paidOrders)}</div></div>
    <div class="stat"><div class="k">营收</div><div class="v">$${fmt(s.revenue)}</div></div>
    <div class="stat"><div class="k">流通额度</div><div class="v">${fmt(s.totalCredits)}</div></div>
  </div>

  <div class="panel" style="margin-top:16px">
    <h3>近 7 天趋势</h3>
    <div class="row2">
      <div>
        <div style="font-size:11px;color:var(--dim)">新增用户</div>
        <div class="bars">${d.daily.map(x => `
          <div class="bar" style="height:${Math.round(x.users / maxU * 60) + 2}px" title="${x.users}">
            <span>${x.date}</span></div>`).join('')}</div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--dim)">消息量</div>
        <div class="bars">${d.daily.map(x => `
          <div class="bar" style="height:${Math.round(x.messages / maxM * 60) + 2}px" title="${x.messages}">
            <span>${x.date}</span></div>`).join('')}</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h3>人气角色 Top 5</h3>
    <table>
      <thead><tr><th>角色</th><th>浏览</th><th>赞</th><th>对话</th><th>评论</th></tr></thead>
      <tbody>${d.topCards.map(c => `
        <tr><td>${esc(c.nickname)} <span class="masked">${esc(c.name).slice(0, 16)}</span></td>
        <td>${fmt(c.view_count)}</td><td>${fmt(c.like_count)}</td>
        <td>${fmt(c.chat_count)}</td><td>${fmt(c.comment_count)}</td></tr>`).join('')}
      </tbody>
    </table>
  </div>`;
};

// ==================== 文字模型 ====================
PAGES.textModels = async () => {
  const d = await api('list-text-models');
  window.__textModels = d.items;

  return `
  <h2 class="title">文字模型配置</h2>
  <div class="sub">控制聊天用的 LLM 档位、计费与可用性</div>

  <div class="panel">
    <h3>模型列表 <span class="tag">${d.items.length} 个</span>
      <button class="btn sm" style="margin-left:auto" onclick="editTextModel()">+ 新增</button>
    </h3>
    <table>
      <thead>
        <tr><th>ID</th><th>显示名</th><th>底层模型</th><th>档位</th>
        <th>计费/1k</th><th>长度</th><th>VIP</th><th>启用</th><th>操作</th></tr>
      </thead>
      <tbody>
        ${d.items.map(m => `
          <tr>
            <td class="mono">${m.id}</td>
            <td><b>${esc(m.displayName)}</b><div class="masked">${esc(m.name)}</div></td>
            <td class="mono">${esc(m.backend)}</td>
            <td><span class="pill ${m.tier === 'high' ? 'err' : m.tier === 'mid' ? 'warn' : 'dim'}">${m.tier}</span></td>
            <td>${m.creditPer1k}</td>
            <td>${m.maxTokens}</td>
            <td>${m.vipOnly ? '<span class="pill warn">VIP</span>' : '-'}</td>
            <td>
              <div class="switch ${m.enabled ? 'on' : ''}"
                   onclick="toggleTextModel(${m.id}, ${!m.enabled})"></div>
            </td>
            <td>
              <button class="btn ghost sm" onclick="editTextModel(${m.id})">编辑</button>
              <button class="btn ghost sm" onclick="testTextModel(${m.id})">测试</button>
              <button class="btn danger sm" onclick="delTextModel(${m.id})">删</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
};

function editTextModel(id) {
  const m = id ? window.__textModels.find(x => x.id === id) : {
    id: Math.max(0, ...window.__textModels.map(x => x.id)) + 1,
    name: '', displayName: '', backend: 'deepseek-v4.1-flash', provider: 'custom',
    creditPer1k: 3, tier: 'low', maxTokens: 800, temperature: 0.9,
    enabled: true, vipOnly: false, sort: 0, description: '',
  };
  openModal(`
    <h3 style="margin:0 0 16px">${id ? '编辑' : '新增'}文字模型</h3>
    <div class="row2">
      <div class="field"><label>ID（数字，唯一）</label>
        <input id="tm_id" type="number" value="${m.id}" ${id ? 'disabled' : ''}></div>
      <div class="field"><label>显示名</label>
        <input id="tm_dn" value="${esc(m.displayName)}" placeholder="创镜 Flash"></div>
    </div>
    <div class="row2">
      <div class="field"><label>内部名</label>
        <input id="tm_name" value="${esc(m.name)}" placeholder="Flash"></div>
      <div class="field"><label>底层模型</label>
        <input id="tm_backend" value="${esc(m.backend)}" placeholder="deepseek-v4.1-flash"></div>
    </div>
    <div class="row3">
      <div class="field"><label>计费（额度/1k token）</label>
        <input id="tm_credit" type="number" value="${m.creditPer1k}"></div>
      <div class="field"><label>档位</label>
        <select id="tm_tier">
          <option value="low" ${m.tier==='low'?'selected':''}>low</option>
          <option value="mid" ${m.tier==='mid'?'selected':''}>mid</option>
          <option value="high" ${m.tier==='high'?'selected':''}>high</option>
        </select></div>
      <div class="field"><label>最大长度</label>
        <input id="tm_max" type="number" value="${m.maxTokens}"></div>
    </div>
    <div class="row3">
      <div class="field"><label>温度</label>
        <input id="tm_temp" type="number" step="0.05" value="${m.temperature}"></div>
      <div class="field"><label>VIP 专属</label>
        <select id="tm_vip">
          <option value="0" ${!m.vipOnly?'selected':''}>否</option>
          <option value="1" ${m.vipOnly?'selected':''}>是</option>
        </select></div>
      <div class="field"><label>排序</label>
        <input id="tm_sort" type="number" value="${m.sort}"></div>
    </div>
    <div class="field"><label>说明</label>
      <input id="tm_desc" value="${esc(m.description)}"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveTextModel(${id || 0})">保存</button>
    </div>
  `);
}

async function saveTextModel(id) {
  const model = {
    id: id || Number($('#tm_id').value),
    name: $('#tm_name').value.trim(),
    displayName: $('#tm_dn').value.trim(),
    backend: $('#tm_backend').value.trim(),
    creditPer1k: Number($('#tm_credit').value),
    tier: $('#tm_tier').value,
    maxTokens: Number($('#tm_max').value),
    temperature: Number($('#tm_temp').value),
    vipOnly: $('#tm_vip').value === '1',
    sort: Number($('#tm_sort').value),
    description: $('#tm_desc').value,
    enabled: true,
  };
  if (!model.name || !model.backend) return toast('内部名和底层模型必填');
  try {
    await api('save-text-model', { model });
    closeModal(); render('textModels'); toast('已保存');
  } catch (e) { toast(e.message); }
}

async function toggleTextModel(id, enabled) {
  const m = window.__textModels.find(x => x.id === id);
  try {
    await api('save-text-model', { model: { ...m, enabled } });
    render('textModels');
  } catch (e) { toast(e.message); }
}

async function delTextModel(id) {
  if (!confirm('删除模型 ' + id + '?')) return;
  try { await api('delete-text-model', { id }); render('textModels'); toast('已删除'); }
  catch (e) { toast(e.message); }
}

async function testTextModel(id) {
  toast('测试中…');
  try {
    const r = await api('test-text-model', { id });
    if (r.ok) {
      openModal(`
        <h3 style="margin:0 0 12px">测试结果 · 成功</h3>
        <div class="field"><label>耗时</label><div>${r.latency} ms</div></div>
        <div class="field"><label>返回模型</label><div class="mono">${esc(r.model)}</div></div>
        <div class="field"><label>用量</label>
          <div class="mono">${JSON.stringify(r.usage || {})}</div></div>
        <div class="field"><label>回复</label>
          <div style="background:rgba(255,255,255,.04);padding:11px;border-radius:9px;
               line-height:1.7;white-space:pre-wrap">${esc(r.reply)}</div></div>
        <div style="text-align:right"><button class="btn" onclick="closeModal()">关闭</button></div>
      `);
    } else {
      openModal(`
        <h3 style="margin:0 0 12px;color:var(--err)">测试失败</h3>
        <div class="field"><label>耗时</label><div>${r.latency} ms</div></div>
        <div class="field"><label>错误</label>
          <div style="color:var(--err);word-break:break-all">${esc(r.error)}</div></div>
        <div style="text-align:right"><button class="btn" onclick="closeModal()">关闭</button></div>
      `);
    }
  } catch (e) { toast(e.message); }
}

// ==================== 生图模型 ====================
PAGES.imageModels = async () => {
  const d = await api('list-image-models');
  window.__imageModels = d.items;

  return `
  <h2 class="title">生图模型配置</h2>
  <div class="sub">控制绘图引擎的接口地址、密钥、尺寸与价格</div>

  <div class="panel">
    <h3>引擎列表 <span class="tag">${d.items.length} 个</span>
      <button class="btn sm" style="margin-left:auto" onclick="editImageModel()">+ 新增</button>
    </h3>
    <table>
      <thead>
        <tr><th>ID</th><th>名称</th><th>Provider</th><th>接口</th>
        <th>密钥</th><th>尺寸</th><th>价格</th><th>启用</th><th>操作</th></tr>
      </thead>
      <tbody>
        ${d.items.map(m => `
          <tr>
            <td class="mono">${esc(m.id)}</td>
            <td><b>${esc(m.name)}</b><div class="masked">${esc(m.description)}</div></td>
            <td><span class="pill dim">${esc(m.provider)}</span></td>
            <td class="mono" style="max-width:180px;overflow:hidden;text-overflow:ellipsis">
              ${m.endpoint ? esc(m.endpoint) : '<span class="masked">未配置</span>'}</td>
            <td>${m.hasKey ? '<span class="pill ok">已配置</span>' : '<span class="pill err">缺失</span>'}</td>
            <td>${m.width}×${m.height}<div class="masked">${m.aspectRatio}</div></td>
            <td>${m.credit}</td>
            <td><div class="switch ${m.enabled ? 'on' : ''}"
                 onclick="toggleImageModel('${m.id}', ${!m.enabled})"></div></td>
            <td>
              <button class="btn ghost sm" onclick="editImageModel('${m.id}')">编辑</button>
              <button class="btn danger sm" onclick="delImageModel('${m.id}')">删</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>

  <div class="panel">
    <h3>说明</h3>
    <div style="color:var(--dim);line-height:1.9;font-size:12.5px">
      当前 <b>provider = placeholder</b> 时，返回的是服务端生成的渐变占位图。<br>
      要接真实生图，把 provider 改成 <b>openai</b>（OpenAI 兼容 /v1/images/generations）
      或 <b>custom</b>，再填 endpoint、apiKey、modelName。<br>

  </div>`;
};

async function saveImageModel(id) {
  const model = {
    id: id || $('#im_id').value.trim(),
    name: $('#im_name').value.trim(),
    provider: $('#im_provider').value,
    modelName: $('#im_model').value.trim(),
    endpoint: $('#im_endpoint').value.trim(),
    apiKey: $('#im_key').value,
    credit: Number($('#im_credit').value),
    width: Number($('#im_w').value),
    height: Number($('#im_h').value),
    aspectRatio: $('#im_ar').value,
    resolution: $('#im_res').value,
    styleId: Number($('#im_style').value),
    steps: Number($('#im_steps').value),
    cfgScale: Number($('#im_cfg').value),
    sort: Number($('#im_sort').value),
    description: $('#im_desc').value,
    enabled: true,
  };
  if (!model.id || !model.name) return toast('ID 和名称必填');
  try {
    await api('save-image-model', { model });
    closeModal(); render('imageModels'); toast('已保存');
  } catch (e) { toast(e.message); }
}

async function toggleImageModel(id, enabled) {
  const m = window.__imageModels.find(x => x.id === id);
  try {
    await api('save-image-model', { model: { ...m, apiKey: '', enabled } });
    render('imageModels');
  } catch (e) { toast(e.message); }
}

async function delImageModel(id) {
  if (!confirm('删除引擎 ' + id + '?')) return;
  try { await api('delete-image-model', { id }); render('imageModels'); toast('已删除'); }
  catch (e) { toast(e.message); }
}

// ==================== 全局参数 ====================
PAGES.config = async () => {
  const d = await api('list-config');
  const groupNames = {
    general: '基础', chat: '对话默认值', economy: '经济',
    popularity: '热度权重', llm: 'LLM 接入', security: '安全',
  };
  return `
  <h2 class="title">全局参数</h2>
  <div class="sub">修改后立即生效（部分需要重启）</div>
  <form id="cfgForm" onsubmit="saveConfig(event)">
    ${Object.entries(d.groups).map(([g, items]) => `
      <div class="panel">
        <h3>${groupNames[g] || g}</h3>
        ${items.map(it => `
          <div class="field">
            <label>${esc(it.label)} <span class="masked">${esc(it.key)}</span></label>
            <input name="cfg_${esc(it.key)}" value="${esc(it.value)}"
                   ${it.type === 'int' ? 'type="number"' : ''}>
          </div>`).join('')}
      </div>`).join('')}
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button type="submit" class="btn">保存全部</button>
    </div>
  </form>`;
};

async function saveConfig(e) {
  e.preventDefault();
  const items = {};
  for (const el of e.target.querySelectorAll('input[name^="cfg_"]')) {
    items[el.name.slice(4)] = el.value;
  }
  try { await api('save-config', { items }); toast('已保存'); }
  catch (err) { toast(err.message); }
}

// ==================== 用户管理 ====================

  const d = await api('list-users', { keyword: kw, status, limit: 30 });
  window.__users = d.items;

  return `
  <h2 class="title">用户管理</h2>
  <div class="sub">共 ${fmt(d.total)} 人</div>

  <div class="panel">
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <input id="userKw" value="${esc(kw)}" placeholder="搜索 ID / 昵称 / 用户名"

                    border:1px solid var(--line);color:var(--text);outline:none">
      <select id="userStatus" style="padding:9px 12px;border-radius:9px;
              background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text)">

        <option value="active" ${status==='active'?'selected':''}>正常</option>

    <table>
      <thead>
        <tr><th>用户</th><th>ID</th><th>余额</th><th>会员</th>
        <th>状态</th><th>签到</th><th>注册</th><th>操作</th></tr>
      </thead>
      <tbody>
        ${d.items.map(u => `
          <tr>
            <td><b>${esc(u.name)}</b><div class="masked">@${esc(u.username || '-')}</div></td>
            <td class="mono">${esc(u.id)}</td>
            <td>${fmt(u.balance)}</td>
            <td>${u.member ? '<span class="pill warn">会员</span>' : '-'}</td>
            <td><span class="pill ${u.status==='active'?'ok':u.status==='banned'?'err':'dim'}">
              ${u.status==='active'?'正常':u.status==='banned'?'封禁':'已注销'}</span></td>
            <td>${u.checkinStreak} 天</td>
            <td class="masked">${dt(u.createdAt).slice(0,10)}</td>
            <td>
              <button class="btn ghost sm" onclick="viewUser('${u.id}')">详情</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
    ${!d.items.length ? '<div style="text-align:center;padding:30px;color:var(--dim)">没有数据</div>' : ''}
  </div>`;
};

function searchUsers() {
  const kw = $('#userKw').value.trim();
  const st = $('#userStatus').value;
  render('users', kw, st);
}

async function viewUser(id) {
  const d = await api('get-user', { userId: id });
  const u = d.user;
  openModal(`
    <h3 style="margin:0 0 16px">${esc(u.name)} <span class="mono" style="font-size:12px;color:var(--dim)">${esc(u.id)}</span></h3>

    <div class="row3">
      <div class="field"><label>余额</label><div style="font-size:18px;font-weight:700">${fmt(u.balance)}</div></div>
      <div class="field"><label>状态</label>
        <span class="pill ${u.status==='active'?'ok':u.status==='banned'?'err':'dim'}">${u.status}</span></div>
      <div class="field"><label>会员</label>
        ${u.member ? '<span class="pill warn">有效期至 ' + dt(u.memberUntil).slice(0,10) + '</span>' : '未开通'}</div>
    </div>

    <div class="panel" style="margin:14px 0">
      <h3>快捷操作</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" onclick="adjustCredits('${id}')">调整额度</button>
        <button class="btn sm ghost" onclick="setMember('${id}')">设置会员</button>
        ${u.status === 'banned'
          ? `<button class="btn sm" onclick="setUserStatus('${id}','active')">解封</button>`
          : `<button class="btn sm danger" onclick="setUserStatus('${id}','banned')">封禁</button>`}
      </div>
    </div>

    <div class="panel">
      <h3>额度流水（最近 10 条）</h3>
      <table>
        ${d.credits.slice(0,10).map(c => `
          <tr><td>${esc(c.type)}</td>
          <td style="color:${c.amount>=0?'var(--ok)':'var(--err)'}">
            ${c.amount>=0?'+':''}${fmt(c.amount)}</td>
          <td class="masked">${esc(c.note)}</td>
          <td class="masked">${dt(c.at)}</td></tr>`).join('')}
      </table>
      ${!d.credits.length ? '<div style="color:var(--dim);padding:10px">无记录</div>' : ''}
    </div>

    <div class="panel">
      <h3>会话设备（${d.sessions.length}）</h3>
      <table>
        ${d.sessions.map(s => `
          <tr><td>${esc(s.device_name)}</td><td class="mono">${esc(s.ip)}</td>
          <td class="masked">${dt(s.lastSeen)}</td>
          <td>${s.revoked ? '<span class="pill err">已下线</span>' : '<span class="pill ok">在线</span>'}</td></tr>`).join('')}
      </table>
    </div>

    <div style="text-align:right;margin-top:10px">
      <button class="btn ghost" onclick="closeModal()">关闭</button>
    </div>
  `);
}

async function adjustCredits(id) {
  const v = prompt('调整额度（正数增加，负数扣除）', '1000');
  if (!v) return;
  const note = prompt('备注', '管理员调整') || '';
  try {
    const r = await api('adjust-credits', { userId: id, amount: Number(v), note });
    toast('已调整，当前余额 ' + fmt(r.balance));
    viewUser(id);
  } catch (e) { toast(e.message); }
}

async function setMember(id) {
  const v = prompt('设置会员天数（0 表示取消）', '30');
  if (v === null) return;
  try { await api('set-member', { userId: id, days: Number(v) }); toast('已设置'); viewUser(id); }
  catch (e) { toast(e.message); }
}

async function setUserStatus(id, status) {
  let reason = '';
  if (status === 'banned') {
    reason = prompt('封禁原因', '违规') || '违规';
  }
  try {
    await api('set-user-status', { userId: id, status, reason });
    toast(status === 'banned' ? '已封禁' : '已解封');
    closeModal(); render('users');
  } catch (e) { toast(e.message); }
}

async function setCardStatus(id, banned) {
  let reason = '';

  try {
    await api('set-card-status', { cardId: id, banned, reason });
    toast(banned ? '已下架' : '已恢复');
    render('cards');
  } catch (e) { toast(e.message); }
}

// ==================== 路由 ====================
async function render(page, ...args) {
  CURRENT = page;
  setActive(page);
  const main = $('#main');
  main.innerHTML = '<div style="color:var(--dim);padding:40px">加载中…</div>';
  try {
    main.innerHTML = await PAGES[page](...args);
  } catch (e) {
    main.innerHTML = `<div style="color:var(--err);padding:20px">加载失败: ${esc(e.message)}</div>`;
  }
}

function openModal(html) {
  $('#modalBox').innerHTML = html + '<button class="close" onclick="closeModal()">✕</button>';
  $('#modal').classList.add('show');
}
function closeModal() { $('#modal').classList.remove('show'); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

// 自动登录
(function auto() {
  const t = new URLSearchParams(location.search).get('token');
  if (t) { $('#tok').value = t; doLogin(); }
})();
</script>
